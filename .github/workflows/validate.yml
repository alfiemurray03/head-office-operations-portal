name: Validate Head Office Operations Centre

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Version 7 release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Cloudflare Pages configuration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const configPath = 'wrangler.jsonc';
          const source = fs.readFileSync(configPath, 'utf8');
          const compatibilityDates = source.match(/"compatibility_date"\s*:/g) || [];
          const hasPagesOutput = /"pages_build_output_dir"\s*:/.test(source);
          const hasWorkerMain = /"main"\s*:/.test(source);

          if (!hasPagesOutput) {
            throw new Error('wrangler.jsonc must define pages_build_output_dir for this Cloudflare Pages project.');
          }
          if (hasWorkerMain) {
            throw new Error('wrangler.jsonc must not define a Worker main entry in the Cloudflare Pages project.');
          }
          if (compatibilityDates.length !== 1) {
            throw new Error(`wrangler.jsonc must contain exactly one compatibility_date; found ${compatibilityDates.length}.`);
          }
          if (!fs.existsSync('public')) {
            throw new Error('The configured Cloudflare Pages output directory does not exist.');
          }
          NODE

      - name: Parse browser JavaScript
        run: find public/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate customer record workspace
        run: node tests/customer-record-workspace.test.mjs

      - name: Parse scheduled Workers
        run: find workers -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build Cloudflare Pages Functions
        run: npm run check

      - name: Build customer automation Worker
        run: npx wrangler deploy --config wrangler.customer-directory.jsonc --dry-run --outdir /tmp/customer-directory-worker

      - name: Apply database migrations to a clean SQLite database
        run: |
          rm -f /tmp/head-office-v7.db
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            sqlite3 /tmp/head-office-v7.db < "${migration}"
          done
          sqlite3 /tmp/head-office-v7.db "SELECT COUNT(*) FROM detection_rules;"
          sqlite3 /tmp/head-office-v7.db "PRAGMA foreign_key_check;"
