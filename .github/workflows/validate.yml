name: Validate Head Office Operations Centre

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Security Operations Centre release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Cloudflare Pages configuration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const configPath = 'wrangler.jsonc';
          const source = fs.readFileSync(configPath, 'utf8');
          const compatibilityDates = source.match(/"compatibility_date"\s*:/g) || [];
          const hasPagesOutput = /"pages_build_output_dir"\s*:/.test(source);
          const hasWorkerMain = /"main"\s*:/.test(source);

          if (!hasPagesOutput) {
            throw new Error('wrangler.jsonc must define pages_build_output_dir for this Cloudflare Pages project.');
          }
          if (hasWorkerMain) {
            throw new Error('wrangler.jsonc must not define a Worker main entry in the Cloudflare Pages project.');
          }
          if (compatibilityDates.length !== 1) {
            throw new Error(`wrangler.jsonc must contain exactly one compatibility_date; found ${compatibilityDates.length}.`);
          }
          if (!fs.existsSync('public')) {
            throw new Error('The configured Cloudflare Pages output directory does not exist.');
          }
          NODE

      - name: Parse browser JavaScript
        run: find public/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Parse Cloudflare Functions
        run: find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate customer record workspace
        run: node tests/customer-record-workspace.test.mjs

      - name: Validate shared modal system
        run: node tests/modal-system.test.mjs

      - name: Validate central customer platform
        run: node tests/central-customer-platform.test.mjs

      - name: Validate bounded customer directory sync
        run: node tests/customer-directory-bounded-sync.test.mjs

      - name: Validate Staff Directory separation
        run: node tests/staff-directory-separation.test.mjs

      - name: Validate Staff Directory tenant sync
        run: node tests/staff-directory-tenant-sync.test.mjs

      - name: Validate adaptive table workspaces
        run: node tests/adaptive-table-workspace.test.mjs

      - name: Validate restriction access restoration
        run: node tests/restriction-access-restoration.test.mjs

      - name: Validate Didit webhook security
        run: node tests/didit-webhook.test.mjs

      - name: Validate Didit operations centre
        run: node tests/didit-operations.test.mjs

      - name: Validate Security Operations Centre
        run: node tests/security-operations-centre.test.mjs

      - name: Validate Stripe reconciliation
        run: node tests/stripe-reconciliation.test.mjs

      - name: Parse scheduled Workers
        run: find workers -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build Cloudflare Pages Functions
        run: npm run check

      - name: Build customer automation Worker
        run: npx wrangler deploy --config wrangler.customer-directory.jsonc --dry-run --outdir /tmp/customer-directory-worker

      - name: Apply database migrations to a clean SQLite database
        run: |
          rm -f /tmp/head-office-central.db
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            sqlite3 /tmp/head-office-central.db < "${migration}"
          done
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM detection_rules;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM platform_operational_profiles;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM identity_verification_sessions;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM identity_verification_webhook_events;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM security_marker_definitions;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM platform_lockdowns;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_webhook_events;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_webhook_events;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_customer_links;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_payment_records;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_order_records;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_subscription_records;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM customer_directory_sync_checkpoints;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_customer_records;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_balance_transactions;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_refund_records;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_dispute_records;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_product_records;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_price_records;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_sync_checkpoints;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM stripe_division_sync_runs;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM staff_directory_profiles;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM staff_manual_reviews;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM staff_number_sequences;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM staff_directory_connectors;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM staff_directory_identities;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM staff_directory_sync_checkpoints;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM staff_directory_sync_runs;"
          sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM customer_notification_deliveries;"
          test "$(sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM security_marker_definitions WHERE marker_code LIKE 'SMC-%';")" = "7"
          test "$(sqlite3 /tmp/head-office-central.db "SELECT COUNT(*) FROM platforms WHERE id='platform-profile-centre' OR code='PROFILE_CENTRE';")" = "0"
          sqlite3 /tmp/head-office-central.db "PRAGMA foreign_key_check;"
